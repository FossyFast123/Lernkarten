<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123b72">
<title>USA Lernkarte – Abschluss</title>
<style>
:root{--blue:#123b72;--accent:#2f73d9;--bg:#f4f7fb;--line:#cfd7e2;--text:#17202a;--muted:#637080;--ok:#9bd6a6;--okline:#2d7b42;--orange:#f0a35b;--orangeLine:#b85b0b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{background:var(--blue);color:white;padding:13px 16px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:18px;margin:0}header span{font-size:13px}
main{max-width:1100px;margin:auto;padding:10px}.top{display:grid;grid-template-columns:1fr auto;gap:10px;margin-bottom:10px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
.small{font-size:12px;color:var(--muted)}.target{font-size:27px;font-weight:800;margin-top:3px}
.score{min-width:205px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:center}.score strong{display:block;font-size:23px;margin-top:2px}
.mapcard{background:#fff;border:1px solid var(--line);border-radius:15px;padding:5px;overflow:auto;min-height:300px}
svg{display:block;width:100%;min-width:760px;height:auto;background:#eef3f7;border-radius:10px}
.state{fill:#e1e6ea;stroke:#59636e;stroke-width:.8;cursor:pointer;touch-action:manipulation}
.state:hover{fill:#d2d9df}.state.done{fill:var(--ok);stroke:var(--okline);stroke-width:1.5;cursor:default}
.state.wrong{fill:var(--orange);stroke:var(--orangeLine);stroke-width:2.3}.state.final-error{fill:#e58b8b;stroke:#a32626;stroke-width:2.2}
.state-label{font-size:10px;font-weight:800;text-anchor:middle;pointer-events:none;fill:#111}
.capital-label{font-size:8px;font-weight:650;text-anchor:middle;pointer-events:none;fill:#111}
.capital-dot{fill:#1d4f91;stroke:#fff;stroke-width:1.5;pointer-events:none}
.feedback{min-height:43px;padding:8px 2px;font-weight:750}
.answers{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px;margin-top:8px}.answers h3{margin:0 0 8px;font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}button{min-height:46px;padding:9px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:15px;font-weight:700}
button.primary{background:var(--accent);border-color:var(--accent);color:white}button:disabled{opacity:.45}
.answer.correct{background:#e8f5eb;border-color:#43a65b}.answer.incorrect{background:#f8e7e7;border-color:#b84b4b}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.found,.errorbox{margin-top:9px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px}
.found{display:flex;gap:6px;flex-wrap:wrap}.pill{background:#e8f5eb;border:1px solid #b7dfbf;border-radius:999px;padding:5px 8px;font-size:12px;font-weight:700}
.errorbox h2{font-size:15px;margin:0 0 7px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px 5px;border-bottom:1px solid #e5e8ec;text-align:left}th{font-size:11px;color:var(--muted);text-transform:uppercase}.wrongtxt{color:#a34d08;font-weight:700}
.loading{padding:35px;text-align:center;color:var(--muted);font-weight:700}
@media(max-width:700px){.top{grid-template-columns:1fr}.score{text-align:left}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>USA Lernkarte – Abschluss</h1><span id="progress">0 / 50</span></header>
<main>
<section class="top">
<div class="card"><div class="small" id="mode">Schritt 1 · Staat geografisch finden</div><div class="target" id="target">Finde: wird geladen …</div></div>
<div class="card score">
<div><span class="small">Richtige</span><strong id="correctCount">0</strong></div>
<div><span class="small">Fehler</span><strong id="errorCount">0</strong></div>
<div><span class="small">Gesamtpunkte</span><strong id="totalScore">0</strong></div>
</div>
</section>
<div class="mapcard"><div id="loading" class="loading">USA-Karte wird geladen …</div><svg id="map" viewBox="0 0 975 610" aria-label="Interaktive Karte der USA" style="display:none"></svg></div>
<div class="feedback" id="feedback"></div>
<section class="answers" id="answers" hidden><h3 id="answerTitle"></h3><div class="grid" id="answerGrid"></div></section>
<div class="controls"><button class="primary" id="next" disabled>Nächster Staat</button><button id="restart">Einheit neu starten</button><button id="clear">Gespeicherten Fortschritt löschen</button></div>
<div class="found"><strong>Bereits gelernt:</strong><span id="foundList">–</span></div>
<section class="errorbox"><h2>Fehlerübersicht</h2><table><thead><tr><th>Gesuchter Staat</th><th>Hauptstadt</th><th>Fehler</th></tr></thead><tbody id="errorList"><tr><td colspan="3">Noch keine Fehler.</td></tr></tbody></table></section>
</main>

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script>
const UNIT=[["Alabama","Montgomery"],["Alaska","Juneau"],["Arizona","Phoenix"],["Arkansas","Little Rock"],["California","Sacramento"],["Colorado","Denver"],["Connecticut","Hartford"],["Delaware","Dover"],["Florida","Tallahassee"],["Georgia","Atlanta"],["Hawaii","Honolulu"],["Idaho","Boise"],["Illinois","Springfield"],["Indiana","Indianapolis"],["Iowa","Des Moines"],["Kansas","Topeka"],["Kentucky","Frankfort"],["Louisiana","Baton Rouge"],["Maine","Augusta"],["Maryland","Annapolis"],["Massachusetts","Boston"],["Michigan","Lansing"],["Minnesota","Saint Paul"],["Mississippi","Jackson"],["Missouri","Jefferson City"],["Montana","Helena"],["Nebraska","Lincoln"],["Nevada","Carson City"],["New Hampshire","Concord"],["New Jersey","Trenton"],["New Mexico","Santa Fe"],["New York","Albany"],["North Carolina","Raleigh"],["North Dakota","Bismarck"],["Ohio","Columbus"],["Oklahoma","Oklahoma City"],["Oregon","Salem"],["Pennsylvania","Harrisburg"],["Rhode Island","Providence"],["South Carolina","Columbia"],["South Dakota","Pierre"],["Tennessee","Nashville"],["Texas","Austin"],["Utah","Salt Lake City"],["Vermont","Montpelier"],["Virginia","Richmond"],["Washington","Olympia"],["West Virginia","Charleston"],["Wisconsin","Madison"],["Wyoming","Cheyenne"]];
const STORE="usaStatesLearning_final_external_v2";
const MAP_URL="https://cdn.jsdelivr.net/npm/us-atlas@3.0.1/states-albers-10m.json";
let queue=[],idx=0,correctCount=0,errorCount=0,totalScore=0,phase="state",locked=false;
let completed=new Set(),capitalDone=new Set(),errors=[],mapReady=false,finalErrors=new Set();

const $=id=>document.getElementById(id);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function newQueue(){return shuffle(UNIT.map((_,i)=>i))}
function current(){return queue[idx]==null?null:UNIT[queue[idx]]}
function save(){try{localStorage.setItem(STORE,JSON.stringify({queue,idx,correctCount,errorCount,totalScore,phase,completed:[...completed],capitalDone:[...capitalDone],errors,finalErrors:[...finalErrors]}))}catch(e){}}
function reset(){queue=newQueue();idx=0;correctCount=0;errorCount=0;totalScore=0;phase="state";locked=false;completed=new Set();capitalDone=new Set();errors=[];finalErrors=new Set();save()}
function load(){try{const x=JSON.parse(localStorage.getItem(STORE)||"null");if(x&&Array.isArray(x.queue)&&x.queue.length===50){queue=x.queue;idx=Math.min(Math.max(+x.idx||0,0),50);correctCount=+x.correctCount||0;errorCount=+x.errorCount||0;totalScore=+x.totalScore||0;phase=x.phase==="capital"?"capital":"state";completed=new Set(x.completed||[]);capitalDone=new Set(x.capitalDone||[]);errors=Array.isArray(x.errors)?x.errors:[];finalErrors=new Set(x.finalErrors||[]);return}}catch(e){}reset()}

function renderLabels(){
 document.querySelectorAll(".state-label,.capital-label,.capital-dot").forEach(e=>e.remove());
 document.querySelectorAll(".state").forEach(e=>e.classList.toggle("final-error",finalErrors.has(e.dataset.name)));
 document.querySelectorAll(".state").forEach(e=>{e.classList.toggle("done",completed.has(e.dataset.name));e.classList.toggle("final-error",finalErrors.has(e.dataset.name));});
 for(const [state,capital] of UNIT){
  if(!completed.has(state))continue;
  const el=[...document.querySelectorAll(".state")].find(x=>x.dataset.name===state); if(!el)continue;
  const f=mapFeatures.find(x=>x.properties.name===state); if(!f)continue;
  const [x,y]=path.centroid(f);
  const t=document.createElementNS("http://www.w3.org/2000/svg","text");t.setAttribute("x",x);t.setAttribute("y",y-3);t.setAttribute("class","state-label");t.textContent=state;$("map").appendChild(t);
  if(capitalDone.has(state)){
   const d=document.createElementNS("http://www.w3.org/2000/svg","circle");d.setAttribute("cx",x);d.setAttribute("cy",y+8);d.setAttribute("r",3.5);d.setAttribute("class","capital-dot");$("map").appendChild(d);
   const c=document.createElementNS("http://www.w3.org/2000/svg","text");c.setAttribute("x",x);c.setAttribute("y",y+20);c.setAttribute("class","capital-label");c.textContent=capital;$("map").appendChild(c);
  }
 }
}
function renderErrors(){$("errorList").innerHTML=errors.length?errors.map(e=>'<tr><td><strong>'+e.state+'</strong></td><td>'+e.capital+'</td><td class="wrongtxt">'+e.type+'</td></tr>').join(""):'<tr><td colspan="3">Noch keine Fehler.</td></tr>'}
function updateCounters(){$("correctCount").textContent=correctCount;$("errorCount").textContent=errorCount;$("totalScore").textContent=totalScore;$("progress").textContent=Math.min(idx,50)+" / 50"}

function paint(){
 updateCounters();if(current())finalErrors=new Set();renderLabels();renderErrors();$("next").disabled=!(locked && phase==="capital");$("answers").hidden=true;
 const c=current();if(!c){
 finalErrors=new Set(errors.map(e=>e.state));
 renderLabels();renderErrors();updateCounters();
 $("target").textContent="Lerneinheit abgeschlossen";
 $("mode").textContent="Fertig – Fehleranalyse";
 $("feedback").textContent=errors.length
   ?"Ergebnis: "+totalScore+" Gesamtpunkte. Die im Durchlauf fehlerhaften Staaten sind rot markiert."
   :"Ergebnis: "+totalScore+" Gesamtpunkte. Fehlerfreier Durchlauf – alle Staaten bleiben grün.";
 save();return
}
 if(phase==="state"){$("mode").textContent="Schritt 1 · Staat geografisch finden";$("target").textContent="Finde: "+c[0];$("feedback").textContent=""}
 else{$("mode").textContent="Schritt 2 · Hauptstadt";$("target").textContent="Hauptstadt von "+c[0]+"?";$("answerTitle").textContent="Wähle die richtige Hauptstadt:";$("answerGrid").innerHTML="";$("answers").hidden=false;makeAnswers();$("feedback").textContent="Staat richtig. Wähle jetzt die Hauptstadt."}
 save();
}
function chooseState(el){
 if(!mapReady||phase!=="state"||locked||!current())return;
 const [state,capital]=current();
 if(el.dataset.name===state){completed.add(state);correctCount++;totalScore++;phase="capital";el.classList.add("done");paint()}
 else{errorCount++;totalScore--;errors.push({state,capital,type:"Staat falsch ausgewählt"});el.classList.add("wrong");$("feedback").textContent="Falsch. Der angeklickte Staat ist orange markiert. Suche weiter.";updateCounters();renderErrors();save();setTimeout(()=>el.classList.remove("wrong"),900)}
}
function makeAnswers(){
 const [,correct]=current();let opts=[correct,...UNIT.map(x=>x[1]).filter(x=>x!==correct).sort(()=>Math.random()-.5).slice(0,3)];shuffle(opts);
 for(const opt of opts){const b=document.createElement("button");b.className="answer";b.textContent=opt;b.onclick=()=>checkCapital(opt,b);$("answerGrid").appendChild(b)}
}
function checkCapital(answer,b){
 if(phase!=="capital"||locked||!current())return;const [state,correct]=current();
 if(answer===correct){correctCount++;totalScore++;capitalDone.add(state);locked=true;document.querySelectorAll(".answer").forEach(x=>x.disabled=true);b.classList.add("correct");$("feedback").textContent="Richtig! "+correct+" bleibt sichtbar.";paint();$("next").disabled=false}
 else{errorCount++;totalScore--;errors.push({state,capital:correct,type:"Hauptstadt falsch"});b.classList.add("incorrect");$("feedback").textContent="Falsch. Versuche es erneut.";updateCounters();renderErrors();save();setTimeout(()=>b.classList.remove("incorrect"),600)}
}
let mapFeatures=[],path;
async function initMap(){
 try{
  if(typeof d3==="undefined"||typeof topojson==="undefined")throw new Error("Bibliotheken nicht geladen");
  const res=await fetch(MAP_URL,{cache:"force-cache"});if(!res.ok)throw new Error("Kartendaten konnten nicht geladen werden");
  const topo=await res.json();mapFeatures=topojson.feature(topo,topo.objects.states).features;
  path=d3.geoPath();const svg=d3.select("#map");
  svg.selectAll("path").data(mapFeatures).join("path").attr("class","state").attr("d",path).attr("data-name",d=>d.properties.name).attr("tabindex",0).attr("role","button").attr("aria-label",d=>d.properties.name)
   .on("click",function(){chooseState(this)}).on("keydown",function(event){if(event.key==="Enter"||event.key===" "){event.preventDefault();chooseState(this)}});
  $("loading").style.display="none";$("map").style.display="block";mapReady=true;paint();
 }catch(e){console.error(e);$("loading").textContent="Die Karte konnte nicht geladen werden. Bitte Internetverbindung prüfen und Seite neu laden.";paint()}
}
$("next").onclick=()=>{
 if(!locked || phase!=="capital") return;
 idx++;
 locked=false;
 phase="state";
 paint();
};
$("restart").onclick=()=>{if(confirm("Lerneinheit wirklich neu starten?")){reset();paint()}};
$("clear").onclick=()=>{if(confirm("Gespeicherten Fortschritt löschen?")){try{localStorage.removeItem(STORE)}catch(e){}reset();paint()}};

load();paint();initMap();
</script>
</body>
</html>
